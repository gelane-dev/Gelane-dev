name: Atualizar SVGs do perfil

on:
  schedule:
    - cron: "0 6 * * *"   # todo dia às 03:00 (Brasília)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/update-profile.yml"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python scripts/generate.py
        env:
          PROFILE_EMAIL: ${{ vars.PROFILE_EMAIL }}
      - name: Commit se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || (git commit -m "chore: atualizar SVGs do perfil" && git push)
